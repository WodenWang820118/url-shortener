global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Consumer service metrics
  - job_name: 'consumer'
    static_configs:
      - targets: ['host.docker.internal:3002']
    metrics_path: '/metrics'

  # Producer service metrics (if we add them later)
  - job_name: 'producer'
    static_configs:
      - targets: ['host.docker.internal:3001']
    metrics_path: '/metrics'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
